name: "Build SFPI"

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
      arch:
        required: true
        type: string
      box:
        required: true
        type: string
      full:
        required: true
        type: boolean
        default: false
      checking:
        required: false
        type: boolean
        default: false
      key:
        required: false
        type: string
      build_id:
        required: false
        type: string
      txz:
        required: false
        type: boolean
        default: true
      validate_headers:
        description: Validate campaign header and raw-effect ABI against the built pin
        required: false
        type: boolean
        default: false

env:
  SUDO: ${{inputs.box == 'none' && 'sudo' || ''}}

run-name: >
  Build ${{inputs.arch}}
  SFPI ${{inputs.tag || github.ref}}${{inputs.box != 'none' && format(' on {0}', inputs.box) || ''}}
jobs:
  build:
    name: Build ${{inputs.arch}}${{inputs.box != 'none' && format('-{0}', inputs.box) || ''}}
    runs-on: ubuntu-22.04${{inputs.arch == 'aarch64' && '-arm' || ''}}
    container:
      image: ${{inputs.box == 'alma' && format('quay.io/pypa/manylinux_2_34_{0}', inputs.arch) || null}}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{inputs.tag || github.ref}}
          fetch-depth: 64
          fetch-tags: true
          submodules: recursive
      - name: Tweak Git
        run: git config --global --add safe.directory '*'
      - name: Install Packages
        run: |
          pkgs="autoconf automake bison dejagnu expect flex gawk python3 texinfo"
          pkgs+=" patchutils ruby wget"
          eval $(./scripts/sfpi-info.sh DIST </dev/null)
          case $sfpi_dist in
            debian)
              $SUDO apt-get update
              $SUDO apt-get -y install $pkgs
              $SUDO apt-get -y install libexpat1-dev libgmp-dev libmpc-dev libmpfr-dev gcc g++
            ;;
            fedora)
              $SUDO dnf install -y $pkgs rpm-build
              $SUDO dnf install -y expat-devel gmp-devel libmpc-devel mpfr-devel gcc gcc-c++
            ;;
            *)
              echo "Unknown distro, winging it"
            ;;
          esac
      - name: Install FPM
        run: $SUDO gem install fpm
      - name: Build Toolchain
        id: toolchain
        shell: bash
        run: |
          scripts/build.sh --gdb --tt-built --small \
            ${{inputs.full && '--full' || ''}} \
            ${{!inputs.checking && '--checking=release' || ''}} \
            ${{inputs.build_id != '' && format('--build-id={0}', inputs.build_id) || ''}} \
            2>&1 | tee toolchain-build.log
      - name: Build Test harness
        run: scripts/build.sh --dejagnu --small
      - name: Run Tests
        shell: bash
        run: |
          mkdir -p build/tests
          scripts/build.sh --test-tt ${{inputs.full && '--test-binutils' || ''}} \
            2>&1 | tee build/tests/toolchain-tests.log
      - name: Validate header declarations
        if: ${{!cancelled() && inputs.validate_headers && steps.toolchain.outcome == 'success'}}
        shell: bash
        run: |
          mkdir -p build/tests
          bash scripts/validate-header-declarations.sh gcc build/sfpi/compiler/bin/riscv-tt-elf-g++ \
            2>&1 | tee build/tests/header-declarations.log
      - name: Validate native header ABI
        if: ${{!cancelled() && inputs.validate_headers && steps.toolchain.outcome == 'success'}}
        shell: bash
        run: |
          mkdir -p build/tests
          bash scripts/validate-header-abi.sh build/sfpi build/tests/header-abi \
            2>&1 | tee build/tests/header-abi.log
      - name: Package toolchain
        run: scripts/release.sh --ci --tt-built ${{!inputs.txz && '--no-txz' || null}}
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-${{inputs.arch}}-${{inputs.box}}
          path: build/release/*
          compression-level: 0
      - name: Upload results
        if: ${{always()}}
        uses: actions/upload-artifact@v6
        with:
          name: tests-${{inputs.arch}}-${{inputs.box}}
          path: build/tests/
      - name: Upload build configuration
        if: ${{always()}}
        uses: actions/upload-artifact@v6
        with:
          name: configuration-${{inputs.arch}}-${{inputs.box}}
          path: |
            toolchain-build.log
            build/config.log
            build/version
            build/hashes.pre
            build/build-gcc-newlib-stage2/config.log
            build/build-gcc-newlib-stage2/gcc/config.log
            build/build-gcc-newlib-stage2/gcc/auto-host.h
            build/build-binutils-newlib/config.log
      - id: version
        name: Record config
        shell: bash
        run: |
          eval $(./scripts/sfpi-info.sh DIST <build/version)
          config="$sfpi_version"
          if [[ -n ${{inputs.build_id}} ]]; then
            config+=" [${{inputs.build_id}}]"
          fi
          if [[ -n $sfpi_base ]]; then
              config+=" ($sfpi_base)"
          fi
          if ${{inputs.txz}}; then
              sfpi_pkg+=", txz"
          fi
          config+=" $sfpi_arch $sfpi_dist ($sfpi_pkg)"
          if [[ -z "${{inputs.key}}" ]]; then
            echo "### $config" >>$GITHUB_STEP_SUMMARY
          else
            mkdir -p outputs
            echo "$config" >outputs/config-${{inputs.key}}
          fi
      - name: Upload config
        if: ${{inputs.key != ''}}
        uses: actions/upload-artifact@v6
        with:
          name: config-${{inputs.arch}}-${{inputs.box}}
          path: outputs/config-*
